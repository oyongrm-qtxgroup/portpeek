[package]
name = "portpeek"
version = "0.1.0"
description = "Floating widget for viewing and terminating localhost listeners"
authors = ["Oyong"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "portpeek_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-window-state = "=2.4.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

# Socket enumeration: wraps GetExtendedTcpTable / GetExtendedTcp6Table (iphlpapi).
netstat2 = "=0.11.2"

# Process enrichment. default-features would pull in `component`, which links
# windows/Win32_System_Wmi -- PRD §4 forbids WMI, so we take `system` only.
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
